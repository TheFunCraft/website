<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FunClient Admin</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#0a0709;--panel:#100c0e;--card:#151013;--card2:#1e161a;--border:#2a2126;--line:#1c161a;
    --fg:#f7eff3;--soft:#d6c7cf;--muted:#9b8c95;--dim:#847580;--label:#6a5c64;
    --accent:#e8457f;--accent-dim:#b8386a;--accent-light:#f389ac;
    --ok:#55e083;--warn:#ffcb45;--bad:#ff5c6e;--rev:#ff8a4d;
    --display:'DM Serif Display',Georgia,serif;--body:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:radial-gradient(130% 50% at 50% -20%,rgba(232,69,127,.1),transparent 55%),var(--bg);
    color:var(--fg);font-family:var(--body);-webkit-font-smoothing:antialiased;min-height:100vh}
  .wrap{max-width:900px;margin-inline:auto;padding-left:max(18px,env(safe-area-inset-left));padding-right:max(18px,env(safe-area-inset-right));padding-block:clamp(26px,5vw,48px)}
  header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .logo{display:flex;align-items:center;gap:10px}
  .crown{width:22px}
  .word{font-family:var(--display);font-size:1.5rem;line-height:1}
  .word i{font-style:italic;color:var(--accent-light)}
  .tagline{color:var(--dim);font-size:.82rem}
  .spacer{flex:1}
  .ghost{background:var(--card2);border:1px solid var(--border);color:var(--soft);border-radius:9px;padding:8px 14px;font-weight:600;font-size:.85rem;cursor:pointer;font-family:var(--body)}
  .ghost:hover{border-color:var(--accent-dim);color:var(--fg)}
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0 16px}
  .stat{background:linear-gradient(180deg,var(--card),var(--panel));border:1px solid var(--border);border-radius:12px;padding:12px 16px;min-width:90px}
  .stat .n{font-family:var(--display);font-size:1.5rem;line-height:1}
  .stat .l{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-top:3px;font-weight:600}
  .stat.p .n{color:var(--warn)} .stat.a .n{color:var(--ok)}
  .search{width:100%;background:#0d0a0c;border:1px solid var(--border);border-radius:10px;color:var(--fg);font-family:var(--body);font-size:.95rem;padding:11px 14px;margin-bottom:14px;outline:none}
  .search:focus{border-color:var(--accent-dim)}
  .rows{display:flex;flex-direction:column;gap:9px}
  .row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
  .row.pending{border-color:rgba(255,203,69,.35);background:linear-gradient(90deg,rgba(255,203,69,.06),var(--card) 45%)}
  .who{min-width:0}
  .who .nm{font-weight:700;font-size:1rem;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .badge{font-size:.64rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid}
  .b-pending{color:var(--warn);border-color:rgba(255,203,69,.4);background:rgba(255,203,69,.1)}
  .b-approved{color:var(--ok);border-color:rgba(85,224,131,.4);background:rgba(85,224,131,.1)}
  .b-denied{color:var(--bad);border-color:rgba(255,92,110,.4);background:rgba(255,92,110,.1)}
  .b-revoked{color:var(--rev);border-color:rgba(255,138,77,.4);background:rgba(255,138,77,.1)}
  .who .meta{color:var(--dim);font-size:.78rem;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .acts{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
  .act{border:1px solid var(--border);background:var(--card2);color:var(--soft);border-radius:8px;padding:7px 12px;font-weight:600;font-size:.8rem;cursor:pointer;font-family:var(--body);transition:.14s}
  .act:hover{filter:brightness(1.15)}
  .act.approve{background:rgba(85,224,131,.14);border-color:rgba(85,224,131,.4);color:var(--ok)}
  .act.deny{background:rgba(255,92,110,.12);border-color:rgba(255,92,110,.4);color:var(--bad)}
  .act.revoke{background:rgba(255,138,77,.12);border-color:rgba(255,138,77,.4);color:var(--rev)}
  .act.del{color:var(--dim)}
  .act:disabled{opacity:.5;cursor:default}
  .empty{text-align:center;color:var(--dim);padding:40px 10px;font-size:.95rem}
  @media (max-width:560px){ .row{grid-template-columns:1fr} .acts{justify-content:flex-start} }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo">
        <svg class="crown" viewBox="0 0 18 15" fill="#e8457f" aria-hidden="true"><rect x="0" y="0" width="3" height="5"/><rect x="7.5" y="0" width="3" height="5"/><rect x="15" y="0" width="3" height="5"/><rect x="0" y="4" width="18" height="7" rx="1"/><rect x="0" y="13" width="18" height="2" rx="1"/></svg>
        <div><div class="word">Fun<i>Client</i></div><div class="tagline">Access control</div></div>
      </div>
      <div class="spacer"></div>
      <button class="ghost" id="refresh">Refresh</button>
      <button class="ghost" id="logout">Log out</button>
    </header>

    <div class="stats">
      <div class="stat p"><div class="n" id="s-pending">–</div><div class="l">Pending</div></div>
      <div class="stat a"><div class="n" id="s-approved">–</div><div class="l">Approved</div></div>
      <div class="stat"><div class="n" id="s-total">–</div><div class="l">Total</div></div>
    </div>

    <input class="search" id="search" type="search" placeholder="Filter by username…" autocomplete="off">
    <div class="rows" id="rows"><div class="empty">Loading…</div></div>
  </div>

  <script>
    var ALL=[];
    var rowsEl=document.getElementById('rows');
    function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
    function when(t){ if(!t)return ''; var d=new Date(t); if(isNaN(d))return ''; var day=d.toLocaleDateString(undefined,{month:'short',day:'numeric'}); var tm=d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}); return day+' '+tm; }

    async function load(){
      try{
        var r=await fetch('/api/requests',{headers:{'Accept':'application/json'}});
        if(r.status===401||r.status===404){location.href='/login';return;}
        if(!r.ok){rowsEl.innerHTML='<div class="empty">Couldn’t load requests ('+r.status+').</div>';return;}
        var data=await r.json(); ALL=data.requests||[]; stats(); render();
      }catch(_){ rowsEl.innerHTML='<div class="empty">Could not reach the server.</div>'; }
    }
    function stats(){
      var p=0,a=0; ALL.forEach(function(x){ if(x.status==='pending')p++; if(x.status==='approved')a++; });
      document.getElementById('s-pending').textContent=p;
      document.getElementById('s-approved').textContent=a;
      document.getElementById('s-total').textContent=ALL.length;
    }
    function render(){
      var q=(document.getElementById('search').value||'').toLowerCase();
      var list=ALL.filter(function(x){ return !q || (x.display||x.username||'').toLowerCase().indexOf(q)>=0; });
      if(list.length===0){ rowsEl.innerHTML='<div class="empty">'+(ALL.length?'No matches.':'No access requests yet.')+'</div>'; return; }
      rowsEl.innerHTML=list.map(function(x){
        var name=esc(x.display||x.username); var st=x.status;
        var meta=[]; if(x.requested_at)meta.push('requested '+when(x.requested_at)); if(x.hwid)meta.push('id '+esc(String(x.hwid).slice(0,8)));
        var acts='';
        if(st!=='approved') acts+='<button class="act approve" data-a="approve" data-u="'+esc(x.username)+'">Approve</button>';
        if(st==='pending') acts+='<button class="act deny" data-a="deny" data-u="'+esc(x.username)+'">Deny</button>';
        if(st==='approved') acts+='<button class="act revoke" data-a="revoke" data-u="'+esc(x.username)+'">Revoke</button>';
        acts+='<button class="act del" data-a="delete" data-u="'+esc(x.username)+'">Delete</button>';
        return '<div class="row '+(st==='pending'?'pending':'')+'">'
          +'<div class="who"><div class="nm">'+name+' <span class="badge b-'+st+'">'+st+'</span></div><div class="meta">'+esc(meta.join(' · '))+'</div></div>'
          +'<div class="acts">'+acts+'</div></div>';
      }).join('');
    }
    async function decide(username,action,btn){
      if(action==='delete' && !confirmDelete(username)) return;
      Array.prototype.forEach.call(btn.parentNode.querySelectorAll('button'),function(b){b.disabled=true;});
      try{
        var r=await fetch('/api/decide',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username,action:action})});
        if(r.status===401){location.href='/login';return;}
        await load();
      }catch(_){ Array.prototype.forEach.call(btn.parentNode.querySelectorAll('button'),function(b){b.disabled=false;}); }
    }
    // confirm() is unreliable in some embeds; this page runs in a normal browser so it's fine here.
    function confirmDelete(u){ try{ return window.confirm('Delete the request for '+u+'? This removes them entirely.'); }catch(_){ return true; } }

    rowsEl.addEventListener('click',function(e){ var b=e.target.closest('button[data-a]'); if(b) decide(b.getAttribute('data-u'),b.getAttribute('data-a'),b); });
    document.getElementById('search').addEventListener('input',render);
    document.getElementById('refresh').addEventListener('click',load);
    document.getElementById('logout').addEventListener('click',async function(){ try{ await fetch('/api/logout',{method:'POST'}); }catch(_){}; location.href='/login'; });
    load();
  </script>
</body>
</html>
